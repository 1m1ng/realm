[package]
name = "realm"
version = "2.9.4"
authors = ["zhboner <zhboner@gmail.com>"]
edition = "2021"


[workspace]
members = [
    "realm_io",
    "realm_lb",
    "realm_core",
    "realm_hook",
    "realm_syscall"
]


# realm needs a client-side `ca=` transport option and per-construction
# certificate loading, neither of which upstream kaminari has. The fork
# freezes at 0.14.0 and is pinned to an immutable revision so the build is
# reproducible; `Cargo.lock` must record kaminari with a `git+` source, never
# the registry crate. An unapplied patch is only a cargo *warning* -- the tree
# would silently fall back to the registry, `ca=` would become an ignored
# option again, and every client would revert to public-root verification. CI
# fails the build on that, see the patch-integrity gate in ci.yml.
[patch.crates-io]
kaminari = { git = "https://github.com/1m1ng/kaminari.git", rev = "b8c6e620f4c25f8bebb3aead7a3259535999f3dc" }


[lib]
name = "realm"
path = "src/lib.rs"

[[bin]]
name = "realm"
path = "src/bin.rs"


[dependencies]
# realm
realm_core = { path = "realm_core" }

# common
cfg-if = "1"
futures = "0.3"
walkdir = "2"

# runtime
tokio = { version = "1", features = ["rt"] }

# logger
log = "0.4"
fern = "0.7"
chrono = "0.4"

# command
clap = { version = "4", features = ["string"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# control plane (feature = "control")
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
libc = { version = "0.2", optional = true }

# malloc
mimalloc = { version = "0.1", optional = true, default-features = false }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { version = "0.5", optional = true }
mmap-allocator = { version = "0.3", optional = true }


[dev-dependencies]
env_logger = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }


[features]
default = ["proxy", "balance", "multi-thread", "transport", "transport-tls-awslc", "batched-udp", "brutal-shutdown", "control"]
default-ring = ["proxy", "balance", "multi-thread", "transport", "transport-tls-ring", "batched-udp", "brutal-shutdown", "control"]
default-slim = ["multi-thread", "batched-udp", "brutal-shutdown"]

# unix domain socket control plane: reconcile / status / readiness / version
control = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:libc", "tokio/net", "tokio/sync", "tokio/macros", "tokio/io-util"]

hook = ["realm_core/hook"]
proxy = ["realm_core/proxy"]
brutal-shutdown = ["realm_core/brutal-shutdown"]
balance = ["realm_core/balance"]
transport = ["realm_core/transport", "realm_core/transport-boost"]
transport-tls-ring = ["realm_core/transport-tls-ring"]
transport-tls-awslc = ["realm_core/transport-tls-awslc"]
batched-udp = ["realm_core/batched-udp"]
multi-thread = ["tokio/rt-multi-thread", "realm_core/multi-thread"]
jemalloc = ["jemallocator"]
mi-malloc = ["mimalloc"]
page-alloc = ["mmap-allocator"]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false
panic = "unwind"
strip = true

[profile.release-thin]
inherits = "release"
opt-level = "s"
