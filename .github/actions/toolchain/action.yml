name: toolchain
description: install rust toolchain

inputs:
  target:
    description: "target triple"
    required: true
  cross:
    description: "install cross-rs"
    required: false
    default: "false"
  components:
    description: "additional components"
    required: false
    default: ""
  write-build-cache:
    description: "write build cache"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    # install rust toolchain
    - name: enable incremental compilation
      run: echo "CARGO_INCREMENTAL=1" >> "$GITHUB_ENV"
      shell: bash

    # Single source of truth for the toolchain: the pinned channel in
    # rust-toolchain.toml. `sed` (BRE) works on the linux/macos/windows-bash
    # runners; `grep -P` does not (macOS BSD grep lacks it).
    - name: read pinned toolchain
      id: read_toolchain
      run: |
        channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: install toolchain
      uses: dtolnay/rust-toolchain@master
      id: rustup_install
      continue-on-error: true
      with:
        # channel comes from rust-toolchain.toml (a pinned nightly date), so the
        # components installed here -- notably clippy -- land on the SAME
        # toolchain that `cargo clippy`/`cargo test` resolve to. Hardcoding
        # `nightly` here installed clippy on a different toolchain than the
        # pinned one, and clippy then reported "not installed".
        toolchain: ${{ steps.read_toolchain.outputs.channel }}
        targets: "${{ inputs.cross == 'false' && inputs.target || 'x86_64-unknown-linux-gnu' }}"
        components: "${{ inputs.components }}"

    - name: cache cross-rs
      if: ${{ inputs.cross == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cross
        key: cross-${{ runner.os }}
        restore-keys: cross-${{ runner.os }}

    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "rustc"
        shared-key: ${{ inputs.target }}
        add-job-id-key: "false"
        add-rust-environment-hash-key: "false"
        env-vars: ""
        # workspace target directories are cached.
        cache-targets: "true"
        # only dependent crates will be cached.
        cache-all-crates: "false"
        cache-workspace-crates: "true"
        cache-bin: "false"
        save-if: ${{ github.ref == 'refs/heads/master' }} # wtf?? adding input.write-build-cache doesn't work

    - name: install cross-rs
      if: ${{ inputs.cross == 'true' }}
      # Fetch the prebuilt cross binary instead of `cargo install --git`.
      # cross's source uses `eyre::bail!` in expression position, which the
      # pinned nightly promotes from a future-incompat warning to a hard error
      # ("trailing semicolon in macro used in expression position"), so building
      # cross from source fails. The prebuilt static-musl binary needs no
      # compilation; cross still runs the actual cross-compile inside its docker
      # image using the pinned toolchain. Pinned to a release for reproducibility.
      run: |
        if [ ! -f ~/.cargo/bin/cross ]; then
          mkdir -p ~/.cargo/bin
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C ~/.cargo/bin cross cross-util
        else
          echo "cross-rs already installed (cached)"
        fi
      shell: bash
