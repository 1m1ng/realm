name: ci
on:
  push:
    paths-ignore: ["**.md"]
    branches: [master]
  pull_request:
    paths-ignore: ["**.md"]
    branches: [master]
jobs:
  # A `[patch.crates-io]` entry that stops applying is a cargo *warning*, not an
  # error: the tree falls back to the registry crate, `ca=` becomes an ignored
  # transport option again, and every client silently reverts to public-root
  # verification with nothing failing to point at the cause. So the pin is a
  # standing gate, not a one-shot check -- it compares Cargo.lock against
  # Cargo.toml rather than against a hardcoded revision, so advancing the pin
  # keeps the gate honest without editing it.
  patch-integrity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: kaminari resolves to the pinned fork revision
        run: |
          set -euo pipefail

          # `rev = "..."` inside the [patch.crates-io] table
          want=$(sed -n '/^\[patch\.crates-io\]/,/^\[/p' Cargo.toml \
                 | sed -n 's/^kaminari *=.*rev *= *"\([0-9a-f]\{40\}\)".*/\1/p')
          if [ -z "$want" ]; then
            echo "::error::Cargo.toml has no [patch.crates-io] kaminari entry pinned to a 40-char revision"
            exit 1
          fi

          # the `source = "..."` line of Cargo.lock's kaminari package
          got=$(awk '/^name = "kaminari"$/ {found=1} found && /^source = / {print; exit}' Cargo.lock)
          if [ -z "$got" ]; then
            echo "::error::Cargo.lock has no source line for kaminari"
            exit 1
          fi

          case "$got" in
            *"git+"*"?rev=$want"*) ;;
            *)
              echo "::error::the kaminari patch is not applied -- Cargo.lock resolved to:"
              echo "  $got"
              echo "expected a git+ source at rev $want. Every client would fall back to"
              echo "public-root verification with ca= silently ignored."
              exit 1
              ;;
          esac

          echo "kaminari pinned to $want"

  clippy:
    runs-on: >-
      ${{  
        contains(matrix.target, 'apple') && 'macos-latest' ||
        contains(matrix.target, 'msvc') && 'windows-latest' ||
        'ubuntu-22.04'
      }}
    strategy:
      matrix:
        target:
          # cross
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - name: install toolchain
        uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          components: clippy
          write-build-cache: false

      - name: clippy
        run: cargo clippy

      # realm_core has no default features, so a feature set that is not
      # named below is simply not tested. Be honest about the split:
      #   * the clippy job above cross-compiles + lints all 7 targets, but
      #     only with realm_core's DEFAULT (empty) feature set -- it does
      #     NOT compile-check proxy/balance/multi-thread/batched-udp/etc.
      #   * the steps below actually run the tests, on the runner's HOST
      #     target only (no `--target`): cross-target test execution is not
      #     done here (aarch64/musl rows still run host-arch tests).
      # Feature sets exercised below: proxy; proxy,balance,multi-thread;
      # and proxy,balance,multi-thread,batched-udp -- the last so the
      # lifecycle/udp tests actually run under batched-udp, where the risk
      # lives. `transport` (and its tls-* variants) and `hook` are NOT
      # test-run here: transport pulls kaminari+rcgen, which needs system
      # deps beyond the toolchain action, so it is deliberately left out
      # rather than claim coverage the workflow does not provide.
      - name: test core (proxy)
        run: cargo test -p realm_core --no-fail-fast --features proxy
      - name: test core (proxy, balance, multi-thread)
        run: cargo test -p realm_core --no-fail-fast --features proxy,balance,multi-thread
      - name: test core (proxy, balance, multi-thread, batched-udp)
        run: cargo test -p realm_core --no-fail-fast --features proxy,balance,multi-thread,batched-udp

      - name: test binary
        run: cargo test --no-fail-fast
      # the control plane must stay optional: without it the binary is a
      # plain upstream-compatible cli
      - name: test binary (no control plane)
        run: cargo test --no-fail-fast --no-default-features --features default-slim
