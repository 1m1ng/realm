name: ci
on:
  push:
    paths-ignore: ["**.md"]
    branches: [master]
  pull_request:
    paths-ignore: ["**.md"]
    branches: [master]
jobs:
  clippy:
    runs-on: >-
      ${{  
        contains(matrix.target, 'apple') && 'macos-latest' ||
        contains(matrix.target, 'msvc') && 'windows-latest' ||
        'ubuntu-22.04'
      }}
    strategy:
      matrix:
        target:
          # cross
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - name: install toolchain
        uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          components: clippy
          write-build-cache: false

      - name: clippy
        run: cargo clippy

      # realm_core has no default features, so every combination has to be
      # spelled out: testing only one of them silently skips the others
      - name: test core (proxy)
        run: cargo test -p realm_core --no-fail-fast --features proxy
      - name: test core (proxy, balance, multi-thread)
        run: cargo test -p realm_core --no-fail-fast --features proxy,balance,multi-thread

      - name: test binary
        run: cargo test --no-fail-fast
      # the control plane must stay optional: without it the binary is a
      # plain upstream-compatible cli
      - name: test binary (no control plane)
        run: cargo test --no-fail-fast --no-default-features --features default-slim
